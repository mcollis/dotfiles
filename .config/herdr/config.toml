onboarding = false
[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
window_title = "{hostname}: {workspace} — {terminal_title}"

show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [
    "$sys_cpu_unknown",
    { token = "$sys_cpu_ok", fg = "#98c379" },
    { token = "$sys_cpu_warn", fg = "#e5c07b" },
    { token = "$sys_cpu_hot", fg = "#e06c75" },
    "$sys_mem_unknown",
    { token = "$sys_mem_ok", fg = "#98c379" },
    { token = "$sys_mem_warn", fg = "#e5c07b" },
    { token = "$sys_mem_hot", fg = "#e06c75" },
  ],
]

[ui.sidebar.agents]
row_gap = 1

[theme]
name = "one-dark"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-lazygit.open-lazygit-tab"
description = "Open lazygit in a tab"

[experimental]
switch_ascii_input_source_in_prefix = true

[ui.sound]
enabled = false
